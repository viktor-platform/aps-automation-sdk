name: SDK tests

on:
  pull_request:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:
    inputs:
      run_ssa:
        description: Check the SSA and ACC connection
        type: boolean
        default: false
      run_e2e:
        description: Run the full AutoCAD test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -m 'not integration' -q

  integration:
    name: Run APS integration tests
    needs: unit
    if: github.event_name == 'workflow_dispatch' && (inputs.run_ssa || inputs.run_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APS_SSA_CLIENT_ID: ${{ secrets.APS_SSA_CLIENT_ID }}
      APS_SSA_CLIENT_SECRET: ${{ secrets.APS_SSA_CLIENT_SECRET }}
      APS_SSA_SERVICE_ACCOUNT_ID: ${{ secrets.APS_SSA_SERVICE_ACCOUNT_ID }}
      APS_SSA_KEY_ID: ${{ secrets.APS_SSA_KEY_ID }}
      APS_SSA_PRIVATE_KEY: ${{ secrets.APS_SSA_PRIVATE_KEY }}
      APS_SSA_SCOPE: ${{ secrets.APS_SSA_SCOPE || 'code:all data:read data:write data:create data:search' }}
      APS_TEST_PROJECT_ID: ${{ secrets.APS_TEST_PROJECT_ID }}
      APS_TEST_FOLDER_ID: ${{ secrets.APS_TEST_FOLDER_ID }}
      APS_TEST_SOURCE_ITEM_URN: ${{ secrets.APS_TEST_SOURCE_ITEM_URN }}
      APS_TEST_SIGNING_KEY_JSON: ${{ secrets.APS_TEST_SIGNING_KEY_JSON }}
      APS_TEST_KEEP_DA_RESOURCES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check live test configuration
        id: config
        env:
          RUN_E2E: ${{ inputs.run_e2e || false }}
        run: |
          required=(APS_SSA_CLIENT_ID APS_SSA_CLIENT_SECRET APS_SSA_SERVICE_ACCOUNT_ID
                    APS_SSA_KEY_ID APS_SSA_PRIVATE_KEY APS_TEST_PROJECT_ID APS_TEST_SOURCE_ITEM_URN)
          if [ "$RUN_E2E" = "true" ]; then
            required+=(APS_TEST_FOLDER_ID APS_TEST_SIGNING_KEY_JSON)
          fi
          missing=()
          for var in "${required[@]}"; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            printf 'Missing secret: %s\n' "${missing[@]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: uv sync --locked --group dev
      - name: Check SSA and ACC connection
        if: steps.config.outputs.configured == 'true'
        run: uv run pytest -m 'integration and not e2e' -v --tb=short --maxfail=1
      - name: Run full AutoCAD test
        if: steps.config.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_e2e
        run: uv run pytest -m e2e -v --tb=short --maxfail=1
